# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: assetdep
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: S4HANA_DEV080_SAML_ASSERTION
          url: https://my432555.s4hana.cloud.sap
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZASSETDEPRPT
          description: Depreciation Planning Reports
          package: ZFI_ASSET_DEPRECIATION_FIORI
          transport: DT0K900223
        exclude:
          - /test/
          - /localService/
